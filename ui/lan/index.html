<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PulseScope LAN</title><style>
:root{--bg:#081015;--panel:#101c24;--line:#29404e;--fg:#e7f2f6;--dim:#91a8b5;--a:#2dd4bf;--bad:#fb7185;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}header{position:sticky;top:0;z-index:2;background:#0d1921;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:14px;align-items:center}h1{font-size:16px;margin:0;color:var(--a)}#status{margin-left:auto;font:12px ui-monospace;color:var(--dim)}main{display:grid;grid-template-columns:240px 1fr;gap:10px;padding:10px;max-width:1500px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}h2{font-size:12px;letter-spacing:.08em;color:var(--dim);margin:0 0 8px}button{background:#162933;border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:8px;text-align:left;cursor:pointer}button:hover,button.active{border-color:var(--a);color:var(--a)}#ranges{display:grid;gap:4px;max-height:calc(100vh - 115px);overflow:auto}.range small{display:block;color:var(--dim);margin-top:2px}canvas{width:100%;display:block;background:#050a0e;border:1px solid var(--line);border-radius:4px}.readout{display:flex;gap:14px;flex-wrap:wrap;font:13px ui-monospace;color:var(--dim);margin-bottom:8px}.readout b{color:var(--fg)}#spectrum{height:220px}#waterfall{height:220px;margin-top:8px}.vfos{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-top:10px}.vfo{font:13px ui-monospace}.vfo b{color:var(--a)}.error{color:var(--bad)}@media(max-width:700px){main{grid-template-columns:1fr;padding:6px}.panel{padding:8px}#ranges{max-height:170px;grid-template-columns:repeat(2,minmax(0,1fr))}.range{font-size:11px}#spectrum,#waterfall{height:155px}header{padding:9px}.readout{gap:8px;font-size:11px}}
</style><body><header><h1>PulseScope LAN</h1><span id="status">connecting…</span></header><main><aside class="panel"><h2>SCAN RANGES</h2><div id="ranges"></div></aside><section><div class="panel"><div class="readout"><span>RANGE <b id="range">—</b></span><span>RECEIVER <b id="freq">—</b></span><span>VFOs <b id="vfoCount">—</b></span><span>FRAME <b id="age">—</b></span></div><h2>SPECTRUM</h2><canvas id="spectrum" width="1000" height="260"></canvas><h2 style="margin-top:9px">WATERFALL</h2><canvas id="waterfall" width="1000" height="260"></canvas></div><div id="vfos" class="vfos"></div></section></main><script>
async function json(path,opts){let r=await fetch(path,{cache:'no-store',...opts});let type=r.headers.get('content-type')||'';if(!r.ok||!type.includes('application/json'))throw Error(path+' returned '+r.status+' '+type);return r.json()}const $=id=>document.getElementById(id),fmt=n=>n>=1e9?(n/1e9).toFixed(3)+' GHz':n>=1e6?(n/1e6).toFixed(3)+' MHz':n>=1e3?(n/1e3).toFixed(1)+' kHz':n+' Hz';let active='',lastFrame=0,busy=false,rows=0;const sp=$('spectrum').getContext('2d'),wf=$('waterfall').getContext('2d');
function spectrum(b){let c=sp.canvas,w=c.width,h=c.height;sp.fillStyle='#050a0e';sp.fillRect(0,0,w,h);sp.strokeStyle='#263b47';for(let i=0;i<5;i++){let y=i*h/4;sp.beginPath();sp.moveTo(0,y);sp.lineTo(w,y);sp.stroke()}sp.strokeStyle='#2dd4bf';sp.beginPath();b.forEach((v,i)=>{let x=i*w/(b.length-1),y=(1-Math.max(0,Math.min(1,(v+110)/100)))*(h-8)+4;i?sp.lineTo(x,y):sp.moveTo(x,y)});sp.stroke()}
function waterfall(b){let c=wf.canvas,w=c.width,h=c.height,img=wf.getImageData(0,0,w,h);let d=img.data;d.copyWithin(w*4*3,0,w*4*(h-3));for(let y=0;y<3;y++)for(let x=0;x<w;x++){let v=b[Math.floor(x*b.length/w)],t=Math.max(0,Math.min(1,(v+110)/100)),i=(y*w+x)*4;d[i]=Math.round(30+t*220);d[i+1]=Math.round(t*230);d[i+2]=Math.round(210-t*180);d[i+3]=255}wf.putImageData(img,0,0);rows=Math.min(h,rows+3)}
async function start(name){try{await fetch('/channels/scan/start',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({range_name:name})});active=name;document.querySelectorAll('.range').forEach(x=>x.classList.toggle('active',x.dataset.name===name))}catch(e){$('status').textContent='scan error: '+e}}
async function init(){let b=await json('/channels/banks');$('ranges').innerHTML='';b.forEach(x=>{let q=document.createElement('button');q.className='range';q.dataset.name=x.name;q.innerHTML=x.name+'<small>'+fmt(x.start_hz)+'–'+fmt(x.end_hz)+' · '+x.mode.toUpperCase()+'</small>';q.onclick=()=>start(x.name);$('ranges').append(q)})}
async function frame(){if(busy)return;busy=true;try{let [s,d,v]=await Promise.all([json('/spectrum'),json('/device/status'),json('/vfo/states')]);if(s.bins?.length){spectrum(s.bins);waterfall(s.bins);lastFrame=Date.now();$('status').textContent='● LIVE';$('status').style.color='#2dd4bf'}active=s.range||active;$('range').textContent=active||'idle';$('freq').textContent=fmt(d.center_freq_hz||0);$('vfoCount').textContent=v.length;$('age').textContent='0 ms';$('vfos').innerHTML=v.map(x=>'<div class="panel vfo"><b>VFO '+x.id+'</b><br>'+fmt(x.frequency_hz)+' · '+x.mode.toUpperCase()+'<br>SNR '+Number(x.strength_db).toFixed(1)+' dB · '+(x.muted?'muted':'audio')+'</div>').join('');document.querySelectorAll('.range').forEach(x=>x.classList.toggle('active',x.dataset.name===active))}catch(e){$('status').textContent='● OFFLINE '+e;$('status').className='error'}finally{busy=false}}
init().then(()=>{frame();setTimeout(function loop(){frame();setTimeout(loop,250)},250)});setInterval(()=>{$('age').textContent=lastFrame?Date.now()-lastFrame+' ms':'—'},250);
</script>
