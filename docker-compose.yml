services:
  preflight:
    build:
      context: .
    image: pulsescope:local
    profiles: ["preflight"]
    user: root
    entrypoint: ["/bin/sh", "/usr/local/lib/pulsescope/preflight.sh"]
    environment:
      SOAPY_SDR_PLUGIN_PATH: /opt/pulsescope/drivers/sdrplay-3.15.2/modules0.8
      LD_LIBRARY_PATH: /opt/pulsescope/drivers/sdrplay-3.15.2/lib
    volumes:
      - pulsescope-data:/var/lib/pulsescope
      - sdr-drivers:/opt/pulsescope/drivers:ro
      - /dev/bus/usb:/dev/bus/usb
      - /dev/shm:/dev/shm
      - /proc/sys/net/core/rmem_max:/host/rmem_max:ro
    device_cgroup_rules:
      - "c 189:* rwm"

  pulsescope:
    build:
      context: .
    image: pulsescope:local
    container_name: pulsescope
    restart: unless-stopped
    ports:
      - "8080:8765"
    environment:
      PULSESCOPE_BIND: 0.0.0.0
      PULSESCOPE_PORT: 8765
      PULSESCOPE_DATA_DIR: /var/lib/pulsescope
      PULSESCOPE_UI_DIR: /app/ui
      PULSESCOPE_AUDIO_OUTPUT: "0"
      SOAPY_SDR_PLUGIN_PATH: /opt/pulsescope/drivers/sdrplay-3.15.2/modules0.8
      LD_LIBRARY_PATH: /opt/pulsescope/drivers/sdrplay-3.15.2/lib
      RUST_LOG: pulsescope=info
    volumes:
      - pulsescope-data:/var/lib/pulsescope
      - sdr-drivers:/opt/pulsescope/drivers:ro
      - /dev/bus/usb:/dev/bus/usb
      # The licensed SDRplay API service runs on the host and exchanges samples
      # through POSIX shared memory. This mount is narrower than host IPC mode.
      - /dev/shm:/dev/shm
    device_cgroup_rules:
      - "c 189:* rwm"
    security_opt:
      - no-new-privileges:true

volumes:
  pulsescope-data:
  sdr-drivers:
    external: true
    name: docker_sdr-drivers
